name: CI

on:
  push:
    branches: [main, "feature/*", "fix/*"]
  pull_request:
    branches: [main]

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @nestr/core
      - run: npm run build -w @nestr/client
      - uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: |
            packages/core/dist/
            packages/client/dist/

  typecheck:
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages/
      - run: npx tsc --noEmit -p services/api/tsconfig.json
      - run: npx tsc --noEmit -p apps/desktop/tsconfig.json

  test-api:
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages/
      - run: npm test -w @nestr/api

  test-desktop:
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages/
      - run: npm run test:coverage -w @nestr/desktop
